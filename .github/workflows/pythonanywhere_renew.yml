name: 🔄 Renouvellement PythonAnywhere

# Déclenché le 1er de chaque mois à 9h UTC
# + manuellement depuis l'onglet Actions de GitHub
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  renew:
    name: Renouveler l'app PythonAnywhere
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Appel API PythonAnywhere — Extend webapp
        run: |
          echo "🔄 Renouvellement de l'app ${{ secrets.PA_DOMAIN }} pour l'utilisateur ${{ secrets.PA_USERNAME }}..."
          
          RESPONSE=$(curl -s -o /tmp/pa_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}" \
            "https://www.pythonanywhere.com/api/v0/user/${{ secrets.PA_USERNAME }}/webapps/${{ secrets.PA_DOMAIN }}/extend/")
          
          echo "Code HTTP : $RESPONSE"
          echo "Réponse :"
          cat /tmp/pa_response.json
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ App renouvelée avec succès !"
          else
            echo "❌ Échec du renouvellement (HTTP $RESPONSE)"
            exit 1
          fi

      - name: 🏓 Ping du site pour confirmer qu'il est actif
        run: |
          echo "🔍 Vérification que le site répond..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "https://${{ secrets.PA_DOMAIN }}/robots.txt")
          
          echo "Statut HTTP : $STATUS"
          
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Site actif et accessible !"
          else
            echo "⚠️  Site inaccessible (HTTP $STATUS) — vérifiez l'app PythonAnywhere."
          fi

      - name: 📊 Résumé
        run: |
          echo "================================"
          echo "  Renouvellement PythonAnywhere"
          echo "================================"
          echo "  Domaine : ${{ secrets.PA_DOMAIN }}"
          echo "  Utilisateur : ${{ secrets.PA_USERNAME }}"
          echo "  Date : $(date '+%d/%m/%Y à %H:%M UTC')"
          echo "  Prochain renouvellement : $(date -d '+1 month' '+1er %B %Y' 2>/dev/null || date '+1er du mois prochain')"
          echo "================================"
